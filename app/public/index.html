<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b6dcd">
<title>家庭云盘</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='9' width='24' height='16' rx='3' fill='%233b6dcd'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" fill="currentColor"/></svg>
    <span>家庭云盘</span>
  </div>

  <div class="searchbox">
    <svg viewBox="0 0 24 24" width="16" height="16" class="ico" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="搜索文件名…" autocomplete="off">
    <select id="searchScope" title="搜索范围">
      <option value="all">全盘</option>
      <option value="current">当前目录</option>
    </select>
  </div>

  <button id="btnAdmin" class="btn ghost">管理员</button>
</header>

<div class="toolbar">
  <button id="btnBack" class="btn icon back" title="返回上一级" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <nav class="crumb" id="crumb"></nav>
  <div class="tools">
    <button id="btnNewFolder" class="btn ghost" title="在当前位置新建文件夹">新建文件夹</button>
    <button id="btnCam" class="btn ghost only-mobile" title="拍照上传">拍照</button>
    <button id="btnFolder" class="btn ghost only-desktop" title="上传整个文件夹">传文件夹</button>
    <button id="btnUpload" class="btn primary" title="上传文件">上传</button>
    <select id="sortSel" title="排序方式">
      <option value="name:asc">名称 ↑</option>
      <option value="name:desc">名称 ↓</option>
      <option value="mtime:desc">时间 ↓</option>
      <option value="mtime:asc">时间 ↑</option>
      <option value="size:desc">大小 ↓</option>
      <option value="size:asc">大小 ↑</option>
      <option value="type:asc">类型</option>
    </select>
    <button id="btnView" class="btn icon" title="切换视图">
      <svg viewBox="0 0 24 24" width="16" height="16"><rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<main id="content" class="content"></main>

<div id="dropHint" class="drophint">松开即可上传到当前目录</div>

<footer class="statusbar">
  <div class="usage" id="usage"></div>
  <div class="statustext" id="statusText"></div>
</footer>

<div id="actionbar" class="actionbar" hidden>
  <span class="selcount" id="selCount">已选 0 项</span>
  <div class="actbtns">
    <button id="btnDl" class="btn ghost">下载</button>
    <button id="btnCut" class="btn ghost">剪切</button>
    <button id="btnMove" class="btn ghost">移动到</button>
    <button id="btnDel" class="btn danger">删除</button>
    <button id="btnClear" class="btn icon">取消</button>
  </div>
</div>

<button id="fabUpload" class="fab" title="上传">
  <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 16V5m0 0L8 9m4-4l4 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
</button>

<input type="file" id="fileInput" multiple hidden>
<input type="file" id="folderInput" webkitdirectory directory multiple hidden>
<input type="file" id="camInput" accept="image/*" capture="environment" hidden>

<div id="uploadPanel" class="uploadpanel" hidden></div>

<div id="pwdModal" class="modal" hidden>
  <div class="modalbox">
    <h3 id="pwdTitle">需要管理员密码</h3>
    <p id="pwdDesc" class="sub"></p>
    <input id="pwdInput" type="password" placeholder="请输入管理员密码" autocomplete="current-password">
    <p id="pwdErr" class="err"></p>
    <div class="modalbtns">
      <button id="pwdCancel" class="btn ghost">取消</button>
      <button id="pwdOk" class="btn primary">确定</button>
    </div>
  </div>
</div>

<div id="nameModal" class="modal" hidden>
  <div class="modalbox">
    <h3 id="nameTitle">新建文件夹</h3>
    <input id="nameInput" type="text" placeholder="请输入名称">
    <p id="nameErr" class="err"></p>
    <div class="modalbtns">
      <button id="nameCancel" class="btn ghost">取消</button>
      <button id="nameOk" class="btn primary">确定</button>
    </div>
  </div>
</div>

<div id="moveModal" class="modal" hidden>
  <div class="modalbox">
    <h3>移动到</h3>
    <nav class="crumb" id="moveCrumb"></nav>
    <div class="treelist" id="moveList"></div>
    <p id="moveErr" class="err"></p>
    <div class="modalbtns">
      <button id="moveCancel" class="btn ghost">取消</button>
      <button id="moveHere" class="btn primary">移动到此处</button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal" hidden>
  <div class="modalbox">
    <h3 id="confirmTitle">确认</h3>
    <p id="confirmDesc" class="sub"></p>
    <div class="modalbtns">
      <button id="confirmCancel" class="btn ghost">取消</button>
      <button id="confirmOk" class="btn danger">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
